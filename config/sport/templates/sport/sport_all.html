<!DOCTYPE html>
<html lang="fr">
<head><meta charset="UTF-8"><title>Sports</title></head>
<body>

  — <a href="/sport/categories/">Gérer les catégories</a>

      </li>
    {% endfor %}
  </ul>
</body>
</html>
